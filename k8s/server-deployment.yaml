apiVersion: apps/v1
kind: Deployment
metadata:
  name: kixoff-server
  labels:
    app: kixoff
    component: server
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kixoff
      component: server
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: kixoff
        component: server
        tier: backend
    spec:
      containers:
        - name: kixoff-server
          image: ghcr.io/calenol/kixoff-server:latest
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: kixoff-db-secrets
                  key: db-host
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: kixoff-db-secrets
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kixoff-db-secrets
                  key: db-password
            - name: DB_NAME
              value: kixoff
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: kixoff-redis-secrets
                  key: redis-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kixoff-jwt-secrets
                  key: jwt-secret
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5