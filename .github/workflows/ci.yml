name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# NOTE: There is no package-lock.json committed yet (root or frontend/).
# Until lockfiles are committed:
#   - do not use `cache: 'npm'` (setup-node errors: "Dependencies lock file is not found")
#   - use `npm install` instead of `npm ci`
# Once lockfiles land, restore cache + npm ci for reproducible installs.

jobs:
  # ──────────────────────────────────────────────
  # Lint & Type Check
  # ──────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # cache: 'npm'  # re-enable once package-lock.json is committed

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

      # ESLint is not installed yet — once it is, replace this with `npm run lint`.
      # The gate stays meaningful because tsc --noEmit above must pass.
      - name: Lint (placeholder until ESLint is configured)
        run: echo "ESLint not configured yet — tsc --noEmit serves as the lint gate"

  # ──────────────────────────────────────────────
  # Unit Tests
  # ──────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # cache: 'npm'  # re-enable once package-lock.json is committed

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test -- --coverage --verbose

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: coverage/
          retention-days: 7

  # ──────────────────────────────────────────────
  # Backend Build
  # ──────────────────────────────────────────────
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # cache: 'npm'  # re-enable once package-lock.json is committed

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: dist/
          retention-days: 3

  # ──────────────────────────────────────────────
  # Frontend Build
  # ──────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # cache: 'npm'  # re-enable once frontend/package-lock.json is committed

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Upload frontend build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 3

  # ──────────────────────────────────────────────
  # Security Scan
  # ──────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      # Blocking: HIGH or CRITICAL vulnerabilities fail the pipeline.
      # npm audit requires a lockfile; skip gracefully (and warn) until one is committed,
      # then remove the fallback so the gate blocks again.
      - name: Run npm audit
        run: |
          if [ -f package-lock.json ]; then
            npm audit --audit-level=high
          else
            echo "::warning::No package-lock.json found — skipping npm audit. Commit a lockfile to enable this gate."
          fi

      # Advisory: results uploaded to Security tab; findings do not fail CI.
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # ──────────────────────────────────────────────
  # Summary Gate
  # ──────────────────────────────────────────────
  ci-pass:
    name: CI Pass
    runs-on: ubuntu-latest
    needs: [lint, test, build-backend, build-frontend, security]
    steps:
      - name: All CI checks passed
        run: echo "✅ All CI checks passed — ready to merge"
